name: My First Workflow

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: |
          test -f index.html
          echo "HTML file exists!"

      - name: Success Message
        run: echo "Workflow executed successfully"
